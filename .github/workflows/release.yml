# Release-Workflow: Automatische Versionierung und GitHub Release
name: Release

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: uv installieren
        uses: astral-sh/setup-uv@v5

      - name: Abhaengigkeiten installieren
        run: uv sync --extra dev

      - name: Linting mit flake8
        run: uv run flake8 src/ tests/

      - name: Formatierung pruefen mit black
        run: uv run black --check src/ tests/

      - name: Tests ausfuehren
        run: uv run pytest -v

  release:
    runs-on: ubuntu-latest
    needs: ci
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: uv installieren
        uses: astral-sh/setup-uv@v5

      - name: Release-Branch auf Workflow-SHA setzen
        run: git reset --hard ${{ github.sha }}

      - name: Semantische Versionierung durchfuehren
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: GitHub Release veroeffentlichen
        uses: python-semantic-release/publish-action@v10.5.3
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
