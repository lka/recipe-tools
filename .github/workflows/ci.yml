# CI-Workflow: Tests und Code-Qualitaet
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: uv installieren
        uses: astral-sh/setup-uv@v5

      - name: Abhaengigkeiten installieren
        run: uv sync --extra dev

      - name: Linting mit flake8
        run: uv run flake8 src/ tests/

      - name: Formatierung pruefen mit black
        run: uv run black --check src/ tests/

      - name: Tests ausfuehren
        run: uv run pytest -v
