[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipe-tools"
version = "0.1.0"
description = "Recipe processing tools"
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
    "Pillow",
    "PyMuPDF",
    "pytesseract",
    "beautifulsoup4",
    "lxml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
]

[project.scripts]
recipe-server = "recipe_processor.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_processor"]
